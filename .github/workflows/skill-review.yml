# Tessl Skill Review — runs on PRs that change any SKILL.md; posts scores as one PR comment.
# Docs: https://github.com/tesslio/skill-review
name: Tessl Skill Review

on:
  pull_request:
    branches: [main]
    paths:
      - "**/SKILL.md"

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      TESSL_API_TOKEN: ${{ secrets.TESSL_API_TOKEN }}
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Tessl is not configured
        if: env.TESSL_API_TOKEN == ''
        run: echo "Tessl Skill Review skipped because TESSL_API_TOKEN is not configured."
      - uses: tesslio/skill-review@main
        if: env.TESSL_API_TOKEN != ''
        with:
          tessl-token: ${{ env.TESSL_API_TOKEN }}
      # Optional quality gate (off by default):
      #   fail-threshold: 70
