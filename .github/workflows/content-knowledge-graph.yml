name: Content Knowledge Graph smoke tests

on:
  push:
    paths:
      - "examples/content-knowledge-graph/**"
      - ".github/workflows/content-knowledge-graph.yml"
  pull_request:
    paths:
      - "examples/content-knowledge-graph/**"
      - ".github/workflows/content-knowledge-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s examples/content-knowledge-graph/tests -v
      - name: End-to-end offline demo
        run: |
          python3 examples/content-knowledge-graph/knowledge_graph.py --workspace /tmp/content-graph ingest examples/content-knowledge-graph/demo
          python3 examples/content-knowledge-graph/knowledge_graph.py --workspace /tmp/content-graph extract
          python3 examples/content-knowledge-graph/knowledge_graph.py --workspace /tmp/content-graph validate
          python3 examples/content-knowledge-graph/knowledge_graph.py --workspace /tmp/content-graph graph --out /tmp/content-graph/graph.html
          python3 examples/content-knowledge-graph/knowledge_graph.py --workspace /tmp/content-graph assemble --include-drafts --out /tmp/content-graph/assembly.md
          test -s /tmp/content-graph/graph.html
          test -s /tmp/content-graph/assembly.md
